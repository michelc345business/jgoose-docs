site_name: JGOOSE - Documento de Instruções

theme:
  name: material
  palette:

    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro


  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/style.css

markdown_extensions:
  - attr_list
  - toc:
      permalink: true

nav:
  - Documento de Instruções: doc-instrucoes.md