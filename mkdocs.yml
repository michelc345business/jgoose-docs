site_name: JGOOSE - Documento de Instruções

theme:
  name: material
  palette:

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro

    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo escuro


  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    #- search.highlight
    #- search.suggest
    #- content.code.copy

extra_css:
  - stylesheets/style.css

markdown_extensions:
  - attr_list
  - toc:
      permalink: true

site_url: https://michelc345business.github.io/jgoose-docs/

nav:
  - JGOOSE - Documento de Instruções: doc-instrucoes.md